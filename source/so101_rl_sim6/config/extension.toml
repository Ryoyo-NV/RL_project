[package]

# Semantic Versioning is used: https://semver.org/
version = "0.1.0"

# Description
category = "isaaclab"
readme  = "README.md"

title = "SO-101 RL Sim6"
author = "SO-101 RL Project"
maintainer = "SO-101 RL Project"
description = "SO-101 direct reaching task for the current Isaac Lab and RSL-RL stack"
repository = ""
keywords = ["isaaclab", "rsl-rl", "so101", "reinforcement-learning"]

[dependencies]
"isaaclab" = {}
"isaaclab_physx" = {}
"isaaclab_rl" = {}
"isaaclab_tasks" = {}

[[python.module]]
name = "so101_rl_sim6"

# UI extension module: Kit imports this submodule directly and scans it for ``omni.ext.IExt``
# subclasses. Kept separate from the package root so ``import so101_rl_sim6`` stays omni-free headless.
[[python.module]]
name = "so101_rl_sim6.ui_extension_example"

