# This file configures project tooling only. Package installation is defined in
# source/so101_rl_sim6 and uses the Python environment bundled with Isaac Lab.

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    "logs",
    "_isaac_sim",
    ".vscode",
    "_*",
    ".git",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "C90",
    "SIM",
    "RET",
]
ignore = [
    "E402",
    "D401",
    "RET504",
    "RET505",
    "SIM102",
    "SIM103",
    "SIM108",
    "SIM117",
    "SIM118",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "omniverse-extensions",
    "isaaclab",
    "isaaclab-rl",
    "isaaclab-tasks",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"omniverse-extensions" = [
    "isaacsim",
    "omni",
    "pxr",
    "carb",
    "usdrt",
]
"isaaclab" = ["isaaclab"]
"isaaclab-rl" = ["isaaclab_rl"]
"isaaclab-tasks" = ["isaaclab_tasks"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["source", "scripts"]
exclude = [
    "**/__pycache__",
    "**/_isaac_sim",
    "**/docs",
    "**/logs",
    ".git",
    ".vscode",
]
typeCheckingMode = "basic"
pythonVersion = "3.12"
pythonPlatform = "Linux"
enableTypeIgnoreComments = true
reportMissingImports = "none"
reportMissingModuleSource = "none"
reportGeneralTypeIssues = "none"
reportOptionalMemberAccess = "warning"
reportPrivateUsage = "warning"

[tool.codespell]
skip = "*.usd,*.usda,*.usdz,*.svg,*.png,_isaac_sim*,*.bib,*.css,*/_build"
quiet-level = 0
ignore-words-list = "haa,slq,collapsable,buss,reacher,thirdparty"

[tool.pytest.ini_options]
markers = [
    "isaacsim_ci: mark test to run in isaacsim ci",
]
